<form class="task-form" (ngSubmit)="submit()">

    <div class="field">
        <label for="tf-title">Intitulé <span class="req">obligatoire</span></label>
        <input id="tf-title" type="text" [ngModel]="title()" (ngModelChange)="title.set($event)" name="title"
            placeholder="Relancer Claire Ferrand">
    </div>

    <div class="form-grid">
        <div class="field">
            <label for="tf-date">Échéance</label>
            <input id="tf-date" type="date" [ngModel]="dueDate()" (ngModelChange)="dueDate.set($event)" name="dueDate">
        </div>

        <div class="field">
            <label for="tf-status">Colonne</label>
            <select id="tf-status" [ngModel]="status()" (ngModelChange)="status.set($event)" name="status">
                <option value="a_faire">À faire</option>
                <option value="en_cours">En cours</option>
                <option value="termine">Terminé</option>
            </select>
        </div>

        <div class="field span-2">
            <span class="group-label">Priorité</span>
            <div class="toggles">
                <button type="button" *ngFor="let entry of priorities" class="toggle"
                    [class.on]="priority() === entry.value" [attr.aria-pressed]="priority() === entry.value"
                    (click)="priority.set(entry.value)">
                    {{ entry.label }}
                </button>
            </div>
        </div>

        <div class="field span-2">
            <label for="tf-link">Lien</label>
            <input id="tf-link" type="url" [ngModel]="link()" (ngModelChange)="link.set($event)" name="link"
                placeholder="https://…">
        </div>
    </div>

    <div class="field">
        <label for="tf-search">Candidatures liées</label>

        <div class="chips" *ngIf="chosen().length > 0 || orphanLabels().length > 0">
            <span class="chip" *ngFor="let option of chosen()">
                {{ option.label }}
                <button type="button" [attr.aria-label]="'Détacher ' + option.label" (click)="remove(option.id)">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </span>
            <span class="chip orphan" *ngFor="let label of orphanLabels(); let i = index">
                {{ label }}
                <button type="button" aria-label="Retirer ce lien" (click)="removeOrphan(i)">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </span>
        </div>

        <input id="tf-search" type="text" [ngModel]="searchTerm()" (ngModelChange)="searchTerm.set($event)"
            name="search" placeholder="Chercher un poste ou une entreprise…" autocomplete="off">

        <ul class="suggestions" *ngIf="suggestions().length > 0">
            <li *ngFor="let option of suggestions()">
                <button type="button" (click)="add(option)">
                    <span class="suggestion-label">{{ option.label }}</span>
                    <span class="suggestion-status">{{ option.status }}</span>
                </button>
            </li>
        </ul>

        <p class="hint">
            Le lien est enregistré par identifiant : il reste valable même si le poste ou l'entreprise est renommé.
        </p>
    </div>

    <footer class="form-foot">
        <span class="foot-hint">Seul l'intitulé est obligatoire.</span>
        <button type="button" class="btn-ghost" (click)="onCancel()">Annuler</button>
        <button type="submit" class="btn-solid">{{ task ? 'Enregistrer' : 'Ajouter la tâche' }}</button>
    </footer>
</form>
