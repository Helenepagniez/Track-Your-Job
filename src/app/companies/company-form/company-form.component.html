<form class="company-form" [formGroup]="form" (ngSubmit)="submit()">

    <div class="form-grid">
        <div class="field span-2">
            <label for="co-name">Nom de l'entreprise <span class="req">obligatoire</span></label>
            <input id="co-name" type="text" formControlName="name" placeholder="Agence Why"
                [class.invalid]="form.controls.name.touched && form.controls.name.invalid">
            <p class="hint" *ngIf="lockName">
                Le nom sert de repère pour toutes les candidatures rattachées : il se modifie depuis la fiche, une
                seule fois.
            </p>
            <p class="error" *ngIf="form.controls.name.touched && form.controls.name.invalid">
                Une entreprise a besoin d'un nom.
            </p>
        </div>

        <div class="field">
            <label for="co-sector">Secteur d'activité</label>
            <input id="co-sector" type="text" formControlName="sector" list="known-sectors"
                placeholder="Média · Internet · Communication" autocomplete="off">
            <datalist id="known-sectors">
                <option *ngFor="let sector of sectors" [value]="sector"></option>
            </datalist>
        </div>

        <div class="field">
            <label for="co-website">Site web</label>
            <input id="co-website" type="url" formControlName="website" placeholder="https://www.agencewhy.fr">
        </div>

        <div class="field">
            <label for="co-employees">Nombre de salariés</label>
            <input id="co-employees" type="number" formControlName="employees" placeholder="48" min="0">
        </div>

        <div class="field">
            <label for="co-founded">Année de création</label>
            <input id="co-founded" type="number" formControlName="founded" placeholder="2011" min="1800">
        </div>

        <div class="field span-2">
            <label for="co-group">Groupe ou maison mère</label>
            <input id="co-group" type="text" formControlName="group" placeholder="Fait partie du groupe…">
        </div>

        <div class="field span-2">
            <label for="co-description">Présentation</label>
            <textarea id="co-description" rows="3" formControlName="description"
                placeholder="Ce que fait l'entreprise, sa taille, son positionnement…"></textarea>
        </div>

        <div class="field span-2">
            <label for="co-notes">Notes personnelles</label>
            <textarea id="co-notes" rows="3" formControlName="notes"
                placeholder="Process en 3 temps, ils demandent toujours un portfolio…"></textarea>
        </div>

        <div class="field span-2">
            <label for="co-tags">Étiquettes</label>
            <input id="co-tags" type="text" formControlName="tags" placeholder="portfolio exigé, 3 tours, réponse rapide">
            <p class="hint">Séparées par des virgules.</p>
        </div>
    </div>

    <footer class="form-foot">
        <span class="foot-hint">Saisi ici une seule fois : les candidatures y font référence.</span>
        <button type="button" class="btn-ghost" (click)="onCancel()">Annuler</button>
        <button type="submit" class="btn-solid">{{ isEditing() ? 'Enregistrer' : 'Créer la fiche' }}</button>
    </footer>
</form>
